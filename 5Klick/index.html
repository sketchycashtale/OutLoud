<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F4F4" />
    <meta
      name="description"
      content="Elite protection, training, and gear built on discipline, speed, and precision."
    />
    <title>YOURLOGO — Security and Tactical Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero" id="hero" aria-label="Security and tactical operations">
        <div class="circle" aria-hidden="true">
          <span class="circle-ring"></span>
        </div>

        <img
          class="soldier"
          src="asset/OutLoudIntroPic.png"
          alt="Black-and-white portrait of a soldier in tactical gear"
          fetchpriority="high"
        />

        <header class="site-header">
          <a class="brand" href="#hero" aria-label="YOURLOGO home">
            <span class="brand-symbol" aria-hidden="true"></span>
            <span>YOURLOGO</span>
          </a>

          <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="primary-navigation"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
            <a href="#hero">Services</a>
            <a href="#hero">About</a>
            <a href="#hero">Gallery</a>
            <a href="#hero">Contact</a>
          </nav>

          <a class="phone" href="tel:+910000000000">+91 00000 00000</a>
        </header>

        <div class="diagonal-slash" aria-hidden="true"></div>
        <div class="diagonal-panel" aria-hidden="true"></div>

        <div class="hero-copy">
          <p class="eyebrow"><span aria-hidden="true"></span>Security and tactical ops</p>
          <h1>
            <span class="headline-line"><span>No fear.</span></span>
            <span class="headline-line headline-line--muted"><span>No retreat.</span></span>
          </h1>
          <p class="intro">
            Elite protection, training, and gear built on discipline, speed, and precision.
          </p>
          <div class="hero-actions">
            <a class="button button--primary" href="#hero">Get a quote</a>
            <a class="button button--outline" href="#hero">Our missions</a>
          </div>
        </div>

        <aside class="slide-counter" aria-label="Slide 1 of 3">
          <span class="slide-number">01</span>
          <span class="slide-dot slide-dot--active"></span>
          <span class="slide-dot"></span>
          <span class="slide-dot"></span>
        </aside>

        <div class="language-switch" aria-label="Language">
          <a class="language-active" href="#hero" lang="en">EN</a>
          <span aria-hidden="true">|</span>
          <a href="#hero" lang="hi">HI</a>
        </div>

        <nav class="social-links" aria-label="Social media">
          <a href="https://www.instagram.com/" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle class="icon-fill" cx="17.7" cy="6.5" r="1"></circle>
            </svg>
          </a>
          <a href="https://www.facebook.com/" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.2 20v-7.3h2.5l.4-3h-2.9V7.8c0-.9.3-1.5 1.5-1.5h1.6V3.6a20 20 0 0 0-2.3-.1c-2.3 0-3.9 1.4-3.9 4v2.2H8.5v3h2.6V20"></path>
            </svg>
          </a>
          <a href="https://x.com/" aria-label="X">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.5 3.5h2.8l-6.1 7 7.2 10h-5.7l-4.5-6.1-5.4 6.1H4l6.5-7.5L3.6 3.5h5.8l4.1 5.6 5-5.6Zm-1 15.2H19L8.7 5.2H7.1l10.4 13.5Z"></path>
            </svg>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
