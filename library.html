  <template id="story-first-word">
    <p>The first word is the hardest because it has to cross the distance between what we feel and what we are willing to say.</p>
    <p>We wait for the perfect opening, the sentence that arrives already polished. Most of the time, it does not come. What comes instead is a fragment: a question, a half-formed thought, a quiet “I’ve been thinking.”</p>
    <p>That is enough to begin. A voice grows through use, through the ordinary courage of trying again and letting someone hear us before we have everything figured out.</p>
  </template>

  <template id="story-morning">
    <p>The morning did not announce itself. It arrived in a kettle clicking off, a window left open, and the soft shuffle of someone making room at the table.</p>
    <p>These small things are easy to miss when we are already thinking about what comes next. But attention has its own kind of generosity: it asks us to stay with what is here before turning it into something else.</p>
    <p>For a little while, the day was measured not by what had been finished, but by what we had managed to notice together.</p>
  </template>

  <template id="story-second-answer">
    <p>Someone gives an answer. We nod, ready to respond with one of our own. Then there is a pause, just long enough for the conversation to take a different shape.</p>
    <p>The second answer is often quieter. It may be the part that took longer to trust us with: the uncertainty underneath the certainty, the small detail that changes the story, the thing a person almost decided not to say.</p>
    <p>Listening is not waiting for our turn. It is making enough space for another thought to arrive—and being willing to let it change what we thought we knew.</p>
  </template>

  <template id="story-practice">
    <p>We sometimes talk about finding a voice as if it were hidden somewhere, waiting for the right person to uncover it. But a voice is also something we practice.</p>
    <p>We practice when we name what matters, when we ask a question without knowing exactly where it will lead, and when we come back after a difficult conversation instead of disappearing from it.</p>
    <p>There is no permission slip for beginning. There is only the page, the people beside us, and the next honest thing we can say.</p>
  </template>

  <template id="story-questions">
    <p>What would change if we asked one more question before deciding we understood?</p>
    <p>Which stories do we carry because someone trusted us with them? What does it look like to make room for a voice that is still finding its way into the room?</p>
    <p>These are not questions to solve quickly. They are invitations to keep listening, to return with care, and to leave a little space for what we have not heard yet.</p>
  </template>

  <template id="story-belonging">
    <p>A room becomes welcoming not because everyone speaks in the same way, but because people make space for the differences in how a voice arrives.</p>
    <p>Some people begin with a story. Others ask a question, listen for a while, or need a little more time before they join in. There is value in each of those ways of being present.</p>
    <p>Belonging is something we build together: by paying attention, making room, and showing one another that there is more than one way to be heard.</p>
  </template>

  <template id="story-pause">
    <p>There is a pause after the answer. It can feel like an ending, or like an invitation to stay.</p>
    <p>When we resist the urge to fill every quiet moment, another thought sometimes finds its way out. It might be more complicated than the first answer, or simply more true.</p>
    <p>We do not have to hurry people toward their words. A little patience can make a conversation feel like somewhere they are allowed to arrive.</p>
  </template>

  <template id="story-small-steps">
    <p>Showing up does not always look like a bold beginning. Sometimes it is a small step taken while still uncertain, or the choice to return after a day that did not go to plan.</p>
    <p>Progress can be quiet. It gathers in the habits we keep, the people we check on, and the promises we make small enough to keep.</p>
    <p>One step may not feel like much from where we stand. Taken together, they carry us somewhere new.</p>
  </template>
